[project]
name = "swarm"
version = "0.1.0"
description = "Durable Monty code agent with a virtual Unix filesystem"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.28.1",
    "numpy>=2.2.6",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "pillow>=12.1.0",
    "pydantic-monty==1.1.0",
    "pypdf>=6.21.0",
    "python-docx>=1.2.0",
    "python-dotenv==1.2.1",
    "regex>=2026.9.29",
    "rich>=14.3.2",
]
