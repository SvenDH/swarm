[project]
name = "swarm"
version = "0.1.0"
description = "Durable Monty code agent with a virtual Unix filesystem"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.28.1",
    "jiter>=0.13",
    "openai>=2.17,<3",
    "pydantic>=2.12",
    "pydantic-monty==1.1.0",
    "python-dotenv==1.2.1",
    "rich>=14.3.2",
    "tiktoken>=0.9",
    "prompt-toolkit>=3.0.52,<4",
]

[project.optional-dependencies]
libraries = [
    "numpy>=2.2.6", "pandas>=2.3.3", "pillow>=12.1.0", "openpyxl>=3.1.5",
    "pypdf>=6.21.0", "python-docx>=1.2.0", "matplotlib>=3.10", "scipy>=1.15",
    "seaborn>=0.13", "python-pptx>=1.0", "reportlab>=4.4", "pdfplumber>=0.11",
    "pymupdf>=1.26", "beautifulsoup4>=4.13", "sympy>=1.14",
    "scikit-learn>=1.7", "xlsxwriter>=3.2", "opencv-python-headless>=4.11",
]
